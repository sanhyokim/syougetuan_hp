# site.config.json などを書き換えて GitHub に保存すると、ページを自動で作り直してコミットします。
name: サイトを生成

on:
  push:
    paths:
      - site.config.json
      - build.mjs
      - "src/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ページを生成
        run: node build.mjs
      - name: 生成したページをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "サイトを再生成（設定の変更を反映）"
            git push
          fi
